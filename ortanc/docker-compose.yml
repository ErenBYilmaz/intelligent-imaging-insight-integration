services:
  orthanc:
    image: orthancteam/orthanc:latest
    #command: /run/secrets/  # Path to the configuration files (stored as secrets)
    depends_on:
      - orthanc-index
    ports:
      - 4242:4242
      - 8042:8042
    secrets:
      - orthanc.json
    environment:
      - VERBOSE_STARTUP=true
      - ORTHANC_NAME=Eren-PC
      - OSIMIS_WEB_VIEWER1_PLUGIN_ENABLED=true
      - STONE_WEB_VIEWER_PLUGIN=true
      - DICOM_WEB_PLUGIN_ENABLED=true
      - OHIF_PLUGIN_ENABLED=true
    volumes:
      - .cache/orthanc-db/:/var/lib/orthanc/db/
  orthanc-index:
    image: postgres:15
    restart: unless-stopped
    ports: ["5432:5432"]
    volumes: [".cache/orthanc-index:/var/lib/postgresql/data"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
secrets:
  orthanc.json:
    file: orthanc.json
